<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="product.css">
</head>
<body>
 <div class="news-strip">
		
	</div>
	<div class="hero">
		<div class="hero-text">
			<h1>Welcome to Rolex</h1>
			<p>Your one-stop shop for Rolex, trends </p>
			<a href="product.html" style="background:#ff4081;color:#fff;padding:12px 28px;border-radius:8px;text-decoration:none;font-weight:bold;font-size:18px;">Shop Now</a>
			<a href="cart.html" style="display:inline-block;margin-top:16px;background:#0077ff;color:#fff;padding:12px 28px;border-radius:8px;text-decoration:none;font-weight:bold;font-size:18px;">View Cart</a>
		</div>
		<div class="hero-img">
			<img id="fashionBanner" src="./rolex img/a1.jpeg" alt="Fashion Banner">
		</div>
	</div>
	<div class="featured-products">
		<h2>Featured Products</h2>
		<div class="products-grid" id="productsGrid">
			<!-- Dynamic products will be loaded here -->
		
	</div>

	<!-- Modal for product image -->
	<div id="productModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center;">
		<div style="position: relative; max-width: 80%; max-height: 80%;">
			<span id="closeModal" style="position: absolute; top: -30px; right: -30px; font-size: 30px; color: #fff; cursor: pointer;">&times;</span>
			<img id="modalImg" src="" alt="" style="width: 100%; height: 100%; object-fit: contain; border-radius: 8px;">
		</div>
	</div>

		<script>
// Socket.IO client to receive real-time new-product events
;(function(){
  var s = document.createElement('script');
  s.src = '/socket.io/socket.io.js';
  s.onload = function(){
    try{
      var socket = io();
      socket.on('connect', function(){ console.log('Socket connected'); });
      socket.on('new-product', function(product){
        try{
          var grid = document.getElementById('productsGrid');
          var card = document.createElement('div');
          card.className = 'product-card';
          card.innerHTML = "\n            <img src=\"" + (product.img || './rolex img/a1.jpeg') + "\" alt=\"" + (product.name || '') + "\" style=\"cursor: pointer;\">\n            <h3 style=\"cursor: pointer;\">" + (product.name || '') + "</h3>\n            <p>" + (product.desc || '') + "</p>\n            <div class=\"price\">$" + (product.price || '') + "</div>\n            <div style=\"margin-top:12px;\"><button class=\"add-cart-btn\">Add to Cart</button></div>\n          ";
          grid.insertBefore(card, grid.firstChild);
          var products = JSON.parse(localStorage.getItem('fashion_products') || '[]');
          products.unshift({ name: product.name, desc: product.desc, price: product.price, img: product.img });
          localStorage.setItem('fashion_products', JSON.stringify(products));
        }catch(e){console.error('Error handling new-product', e)}
      });
    }catch(e){console.error('Socket setup failed', e)}
  };
  document.head.appendChild(s);
})();

// Hide login/register links if user is logged in
if (localStorage.getItem('Rolex_logged_in') === 'true') {
    document.querySelectorAll('.navbar a').forEach(function(link) {
        if (link.getAttribute('href') === 'Login.html' || link.getAttribute('href') === 'regis.html') {
            link.style.display = 'none';
        }
    });
}

// Load dynamic products from localStorage
var products = JSON.parse(localStorage.getItem('fashion_products') || '[]');
var grid = document.getElementById('productsGrid');
var isAdmin = localStorage.getItem('is_admin') === 'true';
products.forEach(function(product, index) {
    var card = document.createElement('div');
    card.className = 'product-card';
    var buttonsHtml = '<button class="add-cart-btn" type="button">Add to Cart</button>';
    if (isAdmin) {
      buttonsHtml += '<button class="edit-btn" data-index="' + index + '" type="button">Edit</button><button class="delete-btn" data-index="' + index + '" type="button">Delete</button>';
    }
    card.innerHTML = `
        <img src="${product.img}" alt="${product.name}" style="cursor: pointer;">
        <h3 style="cursor: pointer;">${product.name}</h3>
        <p>${product.desc}</p>
        <div class="price">$${product.price}</div>
        <div style="margin-top:12px;">
          ${buttonsHtml}
        </div>
    `;
    grid.appendChild(card);
});

if (isAdmin) {
  document.querySelectorAll('.static-products .product-card').forEach(card => {
    var buttonsDiv = document.createElement('div');
    buttonsDiv.style.marginTop = '12px';
    buttonsDiv.innerHTML = '<button class="edit-btn" type="button">Edit</button><button class="delete-btn" type="button">Delete</button>';
    card.appendChild(buttonsDiv);
  });
}

// Add to Cart functionality using localStorage
function addToCart(button) {
    try {
        var card = button.closest('.product-card');
        if (!card) {
            console.error('Could not find product card');
            return;
        }
        
        var nameEl = card.querySelector('h3');
        var priceEl = card.querySelector('.price');
        var imgEl = card.querySelector('img');
        
        if (!nameEl || !priceEl || !imgEl) {
            console.error('Could not find product elements');
            return;
        }
        
        var name = nameEl.textContent.trim();
        var price = priceEl.textContent.replace('$','').trim();
        var img = imgEl.getAttribute('src');
        
        var product = { name: name, price: price, img: img, qty: 1 };
        var cart = JSON.parse(localStorage.getItem('aidify_cart') || '[]');
        var found = cart.find(item => item.name === name);
        
        if (found) {
            found.qty += 1;
        } else {
            cart.push(product);
        }
        
        localStorage.setItem('aidify_cart', JSON.stringify(cart));
        console.log('Product added:', product);
        console.log('Cart updated:', cart);
        
        // Show feedback
        button.textContent = 'Added!';
        button.style.background = '#4caf50';
        setTimeout(function() {
            button.textContent = 'Add to Cart';
            button.style.background = '';
        }, 1200);
    } catch (err) {
        console.error('Error adding to cart:', err);
    }
}

// Attach click listeners to all Add to Cart buttons
var buttons = document.querySelectorAll('.add-cart-btn');
buttons.forEach(function(btn) {
    btn.addEventListener('click', function(e) {
        e.preventDefault();
        e.stopPropagation();
        addToCart(this);
    });
});

// Also use event delegation for dynamically added buttons
document.addEventListener('click', function(e) {
    if (e.target.classList.contains('add-cart-btn')) {
        e.preventDefault();
        e.stopPropagation();
        addToCart(e.target);
    } else if (e.target.classList.contains('edit-btn')) {
        var card = e.target.closest('.product-card');
        var name = prompt('New name:', card.querySelector('h3').textContent);
        if (name) card.querySelector('h3').textContent = name;
        var desc = prompt('New description:', card.querySelector('p').textContent);
        if (desc) card.querySelector('p').textContent = desc;
        var price = prompt('New price:', card.querySelector('.price').textContent.replace('$',''));
        if (price) card.querySelector('.price').textContent = '$' + price;
        var index = e.target.getAttribute('data-index');
        if (index !== null) {
            var products = JSON.parse(localStorage.getItem('fashion_products') || '[]');
            products[index].name = name || products[index].name;
            products[index].desc = desc || products[index].desc;
            products[index].price = price || products[index].price;
            localStorage.setItem('fashion_products', JSON.stringify(products));
        }
    } else if (e.target.classList.contains('delete-btn')) {
        var index = e.target.getAttribute('data-index');
        if (index !== null) {
            var products = JSON.parse(localStorage.getItem('fashion_products') || '[]');
            products.splice(index, 1);
            localStorage.setItem('fashion_products', JSON.stringify(products));
            location.reload();
        } else {
            if (confirm('Delete this product?')) {
                e.target.closest('.product-card').remove();
            }
        }
    } else if (e.target.closest('.product-card') && !e.target.classList.contains('add-cart-btn') && !e.target.classList.contains('delete-btn') && !e.target.classList.contains('edit-btn')) {
        var card = e.target.closest('.product-card');
        var img = card.querySelector('img').src;
        document.getElementById('modalImg').src = img;
        document.getElementById('productModal').style.display = 'flex';
    }
});

document.getElementById('closeModal').addEventListener('click', function() {
    document.getElementById('productModal').style.display = 'none';
});

document.getElementById('productModal').addEventListener('click', function(e) {
    if (e.target === this) {
        this.style.display = 'none';
    }
});

// Fashion banner slideshow
const bannerImages = ["./rolex img/a8.jpeg","./rolex img/a1.jpeg","./rolex img/a2.jpeg","./rolex img/a3.jpeg","./rolex img/a4.jpeg","./rolex img/a5.jpeg","./rolex img/a6.jpeg"];
let bannerIndex = 0;
setInterval(function() {
    bannerIndex = (bannerIndex + 1) % bannerImages.length;
    document.getElementById('fashionBanner').src = bannerImages[bannerIndex];
}, 3000);
</script>
</body>
</html>

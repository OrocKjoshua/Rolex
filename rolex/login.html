<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <div class="mainlog">
    <div class="log"><form id="loginForm">
      <div class="form-log">
        <h1>Login</h1>
        
        <input type="email" id="email" name="email" placeholder="Enter your email" class="input-field" required>
        
        
        <input type="password" id="password" placeholder="Enter your password" name="password" class="input-field" required>

        <div style="margin-top: 10px;">
          <input type="checkbox" id="adminCheck" name="admin">
          <label for="adminCheck">Admin Login</label>
        </div>
      </div> 
      <div class="btn">
        <input type="submit" value="Login" class="login-btn">
      </div>
    </form>
    <p>Don't have an account? <a href="SINUP.html.html">Sign Up</a></p>
      
    </div>

  </div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      var email = document.getElementById('email').value;
      var password = document.getElementById('password').value;
      var isAdmin = document.getElementById('adminCheck').checked;

      if (isAdmin) {
        if (password === '1234') {
          localStorage.setItem('Rolex_logged_in', 'true');
          localStorage.setItem('is_admin', 'true');
          alert('Admin login successful!');
          window.location.href = 'Home.html';
        } else {
          alert('Invalid admin code!');
        }
      } else {
        // Regular user login - for now, just set logged in
        localStorage.setItem('Rolex_logged_in', 'true');
        localStorage.setItem('is_admin', 'false');
        alert('Login successful!');
        window.location.href = 'Home.html';
      }
    });
  </script>
</body>
</html>
